<svg xmlns="http://www.w3.org/2000/svg" width="640" height="452" viewBox="0 0 640 452" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Mapay map legend</title>
  <defs>
    <linearGradient id="congestion" gradientUnits="userSpaceOnUse" x1="24" x2="108" y1="0" y2="0">
      <stop offset="0" stop-color="#FFCC00"/>
      <stop offset="0.5" stop-color="#FF3B30"/>
      <stop offset="1" stop-color="#A50E0E"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="639" height="451" rx="16" fill="#FFFFFF" stroke="#D1D1D6"/>
  <text x="24" y="36" font-size="17" font-weight="600" fill="#1C1C1E">Map legend</text>
  <text x="616" y="36" font-size="12" fill="#6C6C70" text-anchor="end">Apple system colours · colour + icon + line style</text>

  <!-- route -->
  <g transform="translate(0,56)">
    <line x1="26" y1="16" x2="106" y2="16" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
    <line x1="26" y1="16" x2="106" y2="16" stroke="#C7C7CC" stroke-width="11" stroke-linecap="round" stroke-opacity="0.6"/>
    <line x1="26" y1="16" x2="106" y2="16" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
    <line x1="26" y1="16" x2="106" y2="16" stroke="#007AFF" stroke-width="6" stroke-linecap="round"/>
    <text x="132" y="21" font-size="14" font-weight="600" fill="#1C1C1E">Your route</text>
    <text x="616" y="21" font-size="12" fill="#6C6C70" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">route · #007AFF</text>
  </g>

  <line x1="24" y1="96" x2="616" y2="96" stroke="#E5E5EA"/>

  <!-- flood -->
  <g transform="translate(0,100)">
    <rect x="24" y="4" width="84" height="24" rx="6" fill="#32ADE6" fill-opacity="0.25" stroke="#32ADE6" stroke-width="2"/>
    <line x1="24" y1="16" x2="108" y2="16" stroke="#32ADE6" stroke-width="10" stroke-opacity="0.55"/>
    <path d="M56 17 q3 -4 6 0 t6 0 t6 0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="132" y="21" font-size="14" fill="#1C1C1E">Flooded street</text>
    <text x="616" y="21" font-size="12" fill="#6C6C70" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">flood · #32ADE6</text>
  </g>

  <!-- weather -->
  <g transform="translate(0,136)">
    <rect x="24" y="4" width="84" height="24" rx="12" fill="#5856D6" fill-opacity="0.25"/>
    <text x="132" y="21" font-size="14" fill="#1C1C1E">Heavy rain / weather alert</text>
    <text x="616" y="21" font-size="12" fill="#6C6C70" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">weather · #5856D6</text>
  </g>

  <!-- construction -->
  <g transform="translate(0,172)">
    <rect x="24" y="4" width="84" height="24" rx="6" fill="#FF9500" fill-opacity="0.15" stroke="#FF9500" stroke-width="2"/>
    <path d="M66 7 L74 25 L58 25 Z" fill="#FF9500"/>
    <rect x="61" y="17" width="10" height="3" fill="#FFFFFF"/>
    <text x="132" y="21" font-size="14" fill="#1C1C1E">Construction</text>
    <text x="616" y="21" font-size="12" fill="#6C6C70" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">construction · #FF9500</text>
  </g>

  <!-- closure -->
  <g transform="translate(0,208)">
    <line x1="24" y1="16" x2="84" y2="16" stroke="#1C1C1E" stroke-width="5" stroke-dasharray="10 6"/>
    <circle cx="98" cy="16" r="9" fill="#1C1C1E"/>
    <rect x="92" y="14" width="12" height="4" rx="1" fill="#FFFFFF"/>
    <text x="132" y="21" font-size="14" fill="#1C1C1E">Road closure</text>
    <text x="616" y="21" font-size="12" fill="#6C6C70" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">closure · #1C1C1E</text>
  </g>

  <!-- congestion -->
  <g transform="translate(0,244)">
    <line x1="24" y1="16" x2="108" y2="16" stroke="url(#congestion)" stroke-width="7" stroke-linecap="round"/>
    <text x="132" y="21" font-size="14" fill="#1C1C1E">Congestion (moderate → severe)</text>
    <text x="616" y="21" font-size="12" fill="#6C6C70" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">congestion · #FFCC00 → #A50E0E</text>
  </g>

  <!-- no sidewalk -->
  <g transform="translate(0,280)">
    <line x1="27" y1="16" x2="105" y2="16" stroke="#AF52DE" stroke-width="5" stroke-dasharray="0.1 9" stroke-linecap="round"/>
    <text x="132" y="21" font-size="14" fill="#1C1C1E">No sidewalk</text>
    <text x="616" y="21" font-size="12" fill="#6C6C70" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">no_sidewalk · #AF52DE</text>
  </g>

  <!-- pothole -->
  <g transform="translate(0,316)">
    <circle cx="66" cy="16" r="7.5" fill="#FFFFFF" stroke="#D1D1D6" stroke-width="0.5"/>
    <circle cx="66" cy="16" r="6" fill="#A2845E"/>
    <text x="132" y="21" font-size="14" fill="#1C1C1E">Pothole</text>
    <text x="616" y="21" font-size="12" fill="#6C6C70" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">pothole · #A2845E</text>
  </g>

  <!-- incident -->
  <g transform="translate(0,352)">
    <circle cx="66" cy="16" r="10" fill="#FF2D55"/>
    <rect x="64.5" y="9" width="3" height="9" rx="1" fill="#FFFFFF"/>
    <circle cx="66" cy="21.5" r="1.7" fill="#FFFFFF"/>
    <text x="132" y="21" font-size="14" fill="#1C1C1E">Incident / police / news</text>
    <text x="616" y="21" font-size="12" fill="#6C6C70" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">incident · #FF2D55</text>
  </g>

  <!-- event -->
  <g transform="translate(0,388)">
    <circle cx="66" cy="16" r="10" fill="#34C759"/>
    <rect x="60" y="11" width="12" height="11" rx="1.5" fill="#FFFFFF"/>
    <rect x="60" y="11" width="12" height="3" fill="#1E7B34"/>
    <text x="132" y="21" font-size="14" fill="#1C1C1E">Event / holiday</text>
    <text x="616" y="21" font-size="12" fill="#6C6C70" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">event · #34C759</text>
  </g>

  <text x="24" y="440" font-size="12" fill="#6C6C70">Width / size = severity · opacity = confidence · predicted = lighter · dark mode uses the dark variants</text>
</svg>
