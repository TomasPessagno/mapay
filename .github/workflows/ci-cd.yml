# MAPAY CI/CD
#
# CI runs on every push and pull request (all branches). Each job only runs if its folder changed.
# CD deploys the backend to Cloud Run only on push to `main` (the repo's default branch: origin/HEAD -> main).
#
# ---- Required GitHub repo configuration (Settings -> Secrets and variables -> Actions) ----
# Secrets:
#   GCP_SA_KEY            base64-encoded service account JSON key. The SA needs: Cloud Run Admin,
#                         Service Account User, Cloud Build Editor, Artifact Registry Admin, Storage Admin
#                         (a --source deploy builds with Cloud Build and pushes to Artifact Registry).
#   MONGODB_URI           Atlas connection string ('@' in the password must be encoded as %40)
#   MONGODB_DB_NAME       required by app/config.py -- the service will not start without it
#   CORS_ORIGINS          comma-separated frontend origins (e.g. the Vercel URL)
#   GEMINI_API_KEY
#   GOOGLE_MAPS_API_KEY
#   HERE_API_KEY
#   TICKETMASTER_API_KEY
#   EIA_API_KEY
#   NWS_USER_AGENT
#   VAPID_PUBLIC_KEY
#   VAPID_PRIVATE_KEY
#   VAPID_SUBJECT
# Variables:
#   GCP_PROJECT_ID
#   GCP_REGION
#   CLOUD_RUN_SERVICE_NAME
#
# RISK: backend/requirements.txt pins no versions (fastapi, motor, pydantic, geopandas, ...), and
# pytest/ruff are not in it at all (installed unpinned below). Any upstream release can change CI
# results or break the deployed service without a code change. Pinning is the backend owner's call.
#
# RISK: CI uses Python 3.14 (matches backend/.venv), but backend/Dockerfile builds on python:3.11-slim,
# and `gcloud run deploy --source` uses that Dockerfile. CI is not testing the Python version that ships.

name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read # paths-filter reads the PR's changed files

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend-ci:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        # Tests import `app.*`, which only resolves with backend/ as the working directory.
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Bayesian log-odds unit test (must exist and pass)
        # pytest exits 4 if this test id is not found, so a deleted/renamed test fails the build.
        run: pytest -q "tests/test_beliefs.py::BeliefMathTests::test_natural_log_odds_and_posterior"
      - name: Test (pytest)
        run: pytest -q

  frontend-ci:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # package.json has no "engines" field
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Type check
        # tsconfig.json is a solution file ("files": []), so plain `tsc --noEmit` checks nothing;
        # -b type-checks the referenced tsconfig.app.json / tsconfig.node.json.
        run: npx tsc -b --noEmit
      - run: npm run build

  deploy-backend:
    needs: [changes, backend-ci]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }} # accepts raw or base64-encoded JSON
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          NWS_USER_AGENT: ${{ secrets.NWS_USER_AGENT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          # Values can contain ',' and '@' (e.g. CORS_ORIGINS, MONGODB_URI), so use gcloud's
          # custom-delimiter syntax (^##^) instead of the default comma separator.
          vars=""
          for name in MONGODB_URI MONGODB_DB_NAME CORS_ORIGINS GEMINI_API_KEY GOOGLE_MAPS_API_KEY \
                      HERE_API_KEY TICKETMASTER_API_KEY EIA_API_KEY NWS_USER_AGENT \
                      VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT; do
            vars+="##${name}=${!name}"
          done
          # No --allow-unauthenticated: new services are private by default. The frontend needs a
          # public API, so grant allUsers the Cloud Run Invoker role once (console or gcloud) or add the flag.
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE_NAME }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --source backend/ \
            --set-env-vars "^##^${vars#\#\#}" \
            --quiet
